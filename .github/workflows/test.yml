name: Startup Monitor

on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        run: python monitor.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: startup-report
          path: report.html
